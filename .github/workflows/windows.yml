name: Native Windows Pi
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['setup.ps1', '*.cmd', 'portable/**', '.pi/**', 'tests/windows-portable.test.mjs', '.github/workflows/windows.yml']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 35
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install native Windows runtime (no WSL)
        run: .\setup.ps1
      - name: Check native runtime and configuration
        run: |
          & '.\.portable\windows\node-v25.6.1-win-x64\node.exe' --test tests/windows-portable.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\pi.cmd --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\tuios.cmd --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & '.\.portable\windows\python\Scripts\python.exe' -c 'import pypdf, docx, mcp, serena'
          exit $LASTEXITCODE
